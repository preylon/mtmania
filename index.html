// --- the ECG actually runs: one rAF per visible strip, scrolling trace ---
function bioPulse(){
  const strips=[...document.querySelectorAll('.biostrip')].filter(el=>{
    if(!el.isConnected)return false;
    const hid=el.closest('.hide');if(hid)return false;          // screen not showing
    const m=el.closest('#modal');if(m&&m.classList.contains('hide'))return false;
    return true;});
  for(const el of strips){
    const cv=el.querySelector('.bioecg');if(!cv)continue;
    if(!cv._st){
      const w=cv.width,hh=cv.height;
      cv._st={x:0,buf:new Float32Array(w).fill(hh/2),g:cv.getContext('2d'),w,h:hh,t:0};
    }
    const st=cv._st,g=st.g,w=st.w,hh=st.h;
    const bpm=+el.dataset.bpm||72, col=el.dataset.col||'#39ffb0';
    // one full beat every (60/bpm) seconds; advance ~2px per frame
    const perBeat=Math.max(26,Math.round((60/bpm)*60*2.2));
    for(let k=0;k<2;k++){
      const ph=st.t%perBeat, u=ph/perBeat;
      let y=hh/2;
      // P wave, QRS spike, T wave — sized to the strip
      if(u>.06&&u<.13)       y=hh/2-Math.sin((u-.06)/.07*Math.PI)*hh*.10;
      else if(u>.17&&u<.20)  y=hh/2+Math.sin((u-.17)/.03*Math.PI)*hh*.12;
      else if(u>.20&&u<.245) y=hh/2-Math.sin((u-.20)/.045*Math.PI)*hh*.46;
      else if(u>.245&&u<.30) y=hh/2+Math.sin((u-.245)/.055*Math.PI)*hh*.22;
      else if(u>.38&&u<.50)  y=hh/2-Math.sin((u-.38)/.12*Math.PI)*hh*.15;
      else y=hh/2+(Math.random()-.5)*1.2;
      st.buf[st.x]=y;st.x=(st.x+1)%w;st.t++;
    }
    // redraw
    g.clearRect(0,0,w,hh);
    g.fillStyle='#04090b';g.fillRect(0,0,w,hh);
    g.strokeStyle='#15323a';g.lineWidth=1;g.beginPath();
    for(let x=0;x<w;x+=12){g.moveTo(x+.5,0);g.lineTo(x+.5,hh);}
    for(let y=0;y<hh;y+=12){g.moveTo(0,y+.5);g.lineTo(w,y+.5);}
    g.stroke();
    g.strokeStyle=col;g.lineWidth=1.6;g.lineJoin='round';g.lineCap='round';
    g.shadowColor=col;g.shadowBlur=5;
    g.beginPath();
    for(let i=0;i<w;i++){
      const idx2=(st.x+i)%w, yy=st.buf[idx2];
      if(i===0)g.moveTo(0,yy);else g.lineTo(i,yy);
    }
    g.stroke();g.shadowBlur=0;
    // bright head
    g.fillStyle='#ffffff';g.fillRect(w-2,st.buf[(st.x+w-1)%w]-1,2,2);
    // fade the oldest end so the wrap seam is invisible
    const gr=g.createLinearGradient(0,0,26,0);
    gr.addColorStop(0,'#04090b');gr.addColorStop(1,'rgba(4,9,11,0)');
    g.fillStyle=gr;g.fillRect(0,0,26,hh);
  }
  requestAnimationFrame(bioPulse);
}
if(typeof requestAnimationFrame==='function')requestAnimationFrame(bioPulse);



// --- seal the bar: the counter runs wall to wall, barkeep is boxed in ---
function sealBars(){
  try{
    const L=G.L;if(!L||!L.bars||L._barsSealed)return;
    for(const b of L.bars){
      const c=b.c,x0=c[0],y0=c[1],x1=c[2],cy=y0+2;
      // 1. counter runs the full width (doors in this row are a way IN behind the bar)
      for(let x=x0;x<=x1;x++){
        const i=idx(x,cy);if(i<0||i>=N)continue;
        const t=L.map[i];
        if(t===T.FLOOR||t===T.COUNTER||t===T.CHAIR||t===T.DEBRIS||t===T.DOOR)L.map[i]=T.COUNTER;
      }
      // 2. seal every remaining way into the staff side.
      //    Flood the strip behind the counter, then wall any opening off it.
      const bk=L.mobs.find(m=>m.k==='barkeep'&&Y(m.pos)<cy&&X(m.pos)>=x0&&X(m.pos)<=x1);
      const seed=bk?bk.pos:idx(x0+1,y0+1);
      if(seed<0||seed>=N||!pass(seed))continue;
      const strip=new Set([seed]),q=[seed];
      while(q.length&&strip.size<80){
        const cur=q.shift();
        for(const d of DIRS){
          const n=cur+d;
          if(n<0||n>=N||strip.has(n))continue;
          if(Y(n)>=cy)continue;                  // never cross to the customer side
          if(X(n)<=x0||X(n)>=x1||Y(n)<=y0)continue; // v0.27: never leak out of the bar room
          if(!pass(n))continue;
          strip.add(n);q.push(n);
        }
      }
      for(const t2 of strip){
        for(const d of DIRS){
          const n=t2+d;
          if(n<0||n>=N||strip.has(n))continue;
          if(!pass(n))continue;                  // an opening out of the staff side
          const tt=L.map[n];
          if(X(n)<=x0||X(n)>=x1||Y(n)<=y0){if(tt===T.DOOR||tt===T.FLOOR)L.map[n]=T.WALL;continue;} // a door in the bar's own wall: brick it up
          if(tt===T.FLOOR||tt===T.CHAIR||tt===T.DEBRIS||tt===T.DOOR)L.map[n]=T.COUNTER;
        }
      }
    }
    L._barsSealed=1;mapChanged();
  }catch(e){}
}

// v0.27: nothing on a floor may be out of reach. Runs after bars are sealed.
//  - loot that lands behind a bar moves out to the customer side
//  - tube dancers are solid, and never sit in front of a door
//  - decor (counters, lockers, pillars, crates...) is never left in front of a door
//  - any loot, the exit, or a cut-off chunk of floor gets a path carved to it (decor first, a wall as a last resort)

    const barFront=new Set();if(L.bars)for(const b of L.bars){for(let x=b.c[0];x<=b.c[2];x++)barFront.add(idx(x,b.c[1]+2));}
    const tube=i=>L.props&&L.props[i]&&L.props[i].k==='tube';
    const isDoorish=t=>t===T.DOOR||t===T.LOCKED||t===T.EXIT||t===T.EXITL||t===T.ENTRY;
    const open=i=>{const t=L.map[i];return isDoorish(t)||t===T.SECRET||(pass(i));};
    const DEC=new Set([T.COUNTER,T.PILLAR,T.CLONE,T.LOCKER,T.TERM,T.POD,T.CART,T.CHAIR,T.DEBRIS]);
    const decor=i=>(DEC.has(L.map[i])&&!barFront.has(i)&&!inKit(i))||(L.props&&L.props[i]&&L.props[i].b&&!tube(i));
    const clear=i=>{if(L.props&&L.props[i]&&!tube(i))delete L.props[i];if(DEC.has(L.map[i]))L.map[i]=T.FLOOR;};
    const nb=i=>DIRS.map(d=>i+d).filter(j=>j>=0&&j<N&&Math.abs(X(j)-X(i))<=1);
    // tubes: drop any spot next to a door, make the rest solid

    // decor in front of doors
    for(let i=0;i<N;i++)if(isDoorish(L.map[i]))for(const j of nb(i))if(decor(j)&&!staff.has(j))clear(j);
    const reach=()=>{const s=new Uint8Array(N),q=[L.entry];s[L.entry]=1;while(q.length){const i=q.pop();for(const j of nb(i))if(!s[j]&&open(j)&&!staff.has(j)){s[j]=1;q.push(j);}}return s;};
    let seen=reach();
    // loot behind the bar or on a tube moves to the nearest reachable free tile
    const taken=new Set(L.items.filter(it=>it.pos>=0).map(it=>it.pos));
    const nearFree=from=>{const vis=new Set([from<0?L.entry:from]),q=[from<0?L.entry:from];while(q.length){const i=q.shift();if(seen[i]&&L.map[i]===T.FLOOR&&!taken.has(i)&&!tube(i)&&!tube(i+W)&&!tube(i+2*W)&&pass(i))return i;for(const j of nb(i))if(!vis.has(j)){vis.add(j);q.push(j);}}return -1;};
    for(const it of L.items)if(it.pos<0||staff.has(it.pos)||(!pass(it.pos)&&!isDoorish(L.map[it.pos])&&!(L.props&&L.props[it.pos]&&L.props[it.pos].k!=='tube'))){const p=nearFree(it.pos);if(p>=0){taken.delete(it.pos);it.pos=p;taken.add(p);}}
    // carve paths to anything still cut off
    const border=i=>X(i)<=0||Y(i)<=0||X(i)>=W-1||Y(i)>=H-1;
    const cost=i=>{if(staff.has(i)||tube(i)||border(i))return 1e9;if(open(i))return 0;if(decor(i))return 1;const t=L.map[i];if(t===T.WALL)return 6;return 1e9;};
    for(let pass_=0;pass_<16;pass_++){
      let tgt=-1;
      if(!seen[L.exit])tgt=L.exit;
      if(tgt<0)for(const it of L.items)if(it.pos>=0&&!seen[it.pos]){tgt=it.pos;break;}
      if(tgt<0){for(let i=0;i<N;i++)if(L.map[i]===T.FLOOR&&!seen[i]&&!staff.has(i)&&!tube(i)){let sz=0;const v=new Set([i]),q=[i];while(q.length&&sz<6){const c=q.pop();sz++;for(const j of nb(c))if(!v.has(j)&&L.map[j]===T.FLOOR&&!seen[j]){v.add(j);q.push(j);}}if(sz>=4){tgt=i;break;}}}
      if(tgt<0)break;

      const dist=new Float64Array(N).fill(1e18),prev=new Int32Array(N).fill(-1),buckets=[[tgt]];dist[tgt]=0;let hit=-1;
      for(let d=0;d<buckets.length&&hit<0;d++){const b=buckets[d];if(!b)continue;for(const i of b){if(dist[i]!==d)continue;if(seen[i]){hit=i;break;}for(const j of nb(i)){const c=cost(j);if(c>=1e9)continue;const nd=d+c;if(nd<dist[j]){dist[j]=nd;prev[j]=i;(buckets[nd]=buckets[nd]||[]).push(j);}}}}
      if(hit<0)break;
      for(let i=hit;i>=0;i=prev[i]){if(decor(i))clear(i);else if(L.map[i]===T.WALL){const lr=wallish(L,i-1)&&wallish(L,i+1),ud=wallish(L,i-W)&&wallish(L,i+W);L.map[i]=(lr||ud)?T.DOOR:T.FLOOR;}}
      seen=reach();
    }
    if(L.holo)L.holo=L.holo.filter(i=>{if(nb(i).some(j=>isDoorish(L.map[j]))){if(L.props)delete L.props[i];return false;}return true;});
    mapChanged();
  }catch(e){console.warn('fixReach',e);}
}

// --- which death animation a mob gets ---
function corpseTy(d){
  if(d.boss)return 'boss';
  if(d.a==='swarm')return 'swarm';
  if(d.ghost)return 'ghost';
  if(d.still||d.a==='turret')return 'still';   // bolted down: topples off its mount
  if(d.a==='drone')return 'fly';               // spins down and crashes
  if(d.synth)return 'synth';                   // stutters, sprays white, drops
  if(d.a==='mech'||(d.big&&d.robot))return 'heavy';
  if(d.a==='quad'||d.a==='crab'||d.a==='cat')return 'beast'; // four legs tumble, robot or not
  if(d.robot)return 'robot';
  if(d.big)return 'heavy';                     // big people land hard too
  return 'org';
}

// --- the clinic shop had no vt, so shopStock() fell through to the DRONE-PARTS branch.
//     That is why the first ripperdoc you ever meet sold scout bots and zero chrome. ---
function stockClinic(){
  try{
    const L=G.L;
    if(!L||L._clinicStocked||G.depth!==0||!L.shopR)return;
    L._clinicStocked=1;
    const hasRipper=L.mobs.some(m=>m.vt==='ripper');
    if(!hasRipper)return;
    if(!L.vt)L.vt='ripper';
    const [x0,y0,x1,y1]=L.shopR;
    const spots=[];
    for(let y=y0+1;y<y1;y++)for(let x=x0+1;x<x1;x++){
      const i=idx(x,y);
      if(pass(i)&&!mobAt(i)&&i!==G.hero.pos&&!L.items.some(e=>e.pos===i))spots.push(i);
    }
    if(!spots.length)return;
    const already=L.items.filter(e=>e&&e.it&&ITEMS[e.it.k]&&ITEMS[e.it.k].type==='implant').length;
    const want=Math.max(0,3-already);
    const picks=[];
    for(let n=0;n<want;n++){
      let it=null;try{it=randGear('implant',1,.6);}catch(e){}
      if(!it||!ITEMS[it.k])continue;
      if(it.cursed){it.cursed=false;it.lvl=0;}
      it.known=true;picks.push(it);
    }
    try{picks.push(mk('regen',{known:true}));}catch(e){}
    for(const it of picks){
      if(!spots.length)break;
      const pos=spots.splice((Math.random()*spots.length)|0,1)[0];
      L.items.push({pos,it,price:Math.max(1,Math.round(itemValue(it)*1.0))});
    }
    mapChanged&&mapChanged();
  }catch(e){}
}

  try{

    const imps=(h.eq.imp||[]).filter(Boolean).map(it=>({k:it.k,lvl:it.lvl|0}));
    localStorage.setItem(NGK,JSON.stringify({
      cycle:prev+1,
      cls:h.cls,name:h.name,look:h.look,diff:g.diff,
      imps,creds:Math.round((h.creds||0)*.25),

function startNG(){
  const d=ngData();
  if(!d){show('#create');refreshCreate();return;}
  newGame({cls:d.cls,name:d.name,diff:d.diff,look:d.look});
  const h=G.hero;
  G.ng=d.cycle;
  // reinstall the chrome you walked out with
  let n=0;
  for(const r of (d.imps||[])){
    if(!ITEMS[r.k])continue;
    const slot=(h.eq.imp||[]).findIndex(x=>!x);
    if(slot<0)break;
    const it=mk(r.k,{known:true});it.lvl=r.lvl|0;
    h.eq.imp[slot]=it;n++;
    if(r.k==='heart2'){it.hb=Math.round(h.mhp*.25);h.mhp+=it.hb;h.hp+=it.hb;}
  }
  h.creds=(h.creds||0)+(d.creds||0);
  // a few levels of muscle memory, not the whole build — applied quietly, no level-up spam
  const carry=Math.max(0,(d.lvl||1)-1);
  if(carry){const up=(h.cls==='enforcer'?6:5)*carry;h.lvl+=carry;h.mhp+=up;h.hp=h.mhp;}
  log(`NEW GAME+${d.cycle} — you woke up in the chair again. The tower does not remember you.`,'hi');
  if(n)log(`${n} implant${n>1?'s':''} came through with you. Sato did not ask.`,'hi');
  if(d.creds)log(`You kept ${d.creds}◈ of what you earned.`,'hi');
  setTimeout(()=>toast(`<b style="color:#ffd24a">NEW GAME+${d.cycle}</b><br>Tougher floors · your chrome carried over`),1200);
  refresh();
}

function cineCards(cards,done){
  const el=cineLayer();el.classList.add('on');
  const cv=document.getElementById('cineCv'),cap=document.getElementById('cineCap');
  let idx2=0,t0=performance.now(),raf=0,fading=0;
  const fit=()=>{const r=el.getBoundingClientRect();cv.width=Math.max(320,r.width|0);cv.height=Math.max(180,r.height|0);};
  fit();window.addEventListener('resize',fit);
  const g=cv.getContext('2d');
  const paint=(now)=>{
    const c=cards[idx2];if(!c){return;}
    g.setTransform(1,0,0,1,0,0);
    cineScene(g,cv.width,cv.height,c.s,now-t0,c.grade);
    raf=requestAnimationFrame(paint);
  };
  const show=()=>{
    const c=cards[idx2];
    if(!c){stop();return;}
    cap.style.opacity=0;
    cap.innerHTML=c.t;
    setTimeout(()=>{cap.style.opacity=1;},90);
  };
  const next=()=>{
    if(fading)return;
    idx2++;
    if(idx2>=cards.length){stop();return;}
    t0=performance.now();show();
  };
  const stop=()=>{
    fading=1;cancelAnimationFrame(raf);
    el.classList.remove('on');
    window.removeEventListener('resize',fit);
    el.removeEventListener('click',next);
    setTimeout(()=>{try{done&&done();}catch(e){}},420);
  };
  el.addEventListener('click',next);
  show();raf=requestAnimationFrame(paint);
  // auto-advance so it plays itself if they just watch
  const tick=()=>{setTimeout(()=>{if(fading)return;const c=cards[idx2];if(!c)return;next();if(!fading)tick();},(cards[idx2]&&cards[idx2].d)||4200);};
  tick();
}

function vShade(hex,f){if(!hex||hex[0]!=='#')return hex;const n=parseInt(hex.slice(1),16);

// a real wheel: tyre ring, rim, hub
function wheel(R,cx,cy,r,fr){
  for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++){
    const d=Math.sqrt(x*x+y*y);
    if(d>r+.4)continue;
    let c;
    if(d>r-1.1)      c='#14161a';          // tyre
    else if(d>r-2.2) c='#2b313a';          // inner tyre
    else if(d>1.6)   c='#434c57';          // rim
    else             c='#8e9aa6';          // hub
    R(cx+x,cy+y,1,1,c);
  }
  // two spokes that rotate
  const a=(fr%4)*(Math.PI/4);
  for(let k=-r+2;k<=r-2;k++){
    R(Math.round(cx+Math.cos(a)*k),Math.round(cy+Math.sin(a)*k),1,1,'#6a7682');
    R(Math.round(cx+Math.cos(a+Math.PI/2)*k),Math.round(cy+Math.sin(a+Math.PI/2)*k),1,1,'#6a7682');
  }
}

 },

  R(4,12,32,1,cl);                                    // top light edge
  R(4,16,32,1,cd);                                    // bottom shade
  R(30,10,7,2,c); R(30,10,7,1,cl);                    // nose rising
  R(3,11,3,2,c); R(3,11,3,1,cl);                      // tail
  R(2,12,1,3,'#ff3b4e'); R(37,11,1,2,'#fff2c8');
  R(7,10,18,2,'#1b1f26'); R(7,10,18,1,'#3a424d');     // bench seat, sits on the chassis
  R(28,8,3,4,'#5a6673');                              // bar column down into the body
  R(31,7,6,2,'#7e8b98'); R(31,7,6,1,'#a3aeba');       // bars
  // ---- pillion (behind), body runs down to the seat ----
  R(11,5,7,6,j2); R(11,5,7,1,vShade(j2,.5));          // torso
  R(12,11,5,1,j2);                                    // hips meeting the seat
  R(11,1,7,4,'#dfe5ec'); R(11,1,7,1,'#ffffff');       // pale helmet
  R(16,3,2,2,'#1b3a5c');                              // visor
  R(17,7,4,2,j2);                                     // arm round the rider ahead
  // ---- front rider, body runs down to the seat ----
  R(21,4,7,7,j1); R(21,4,7,1,vShade(j1,.5));          // torso
  R(22,11,5,1,j1);                                    // hips
  R(27,6,4,2,j1); R(30,7,2,2,sk2);                    // arm to the bars
  R(21,0,7,4,'#e8c22a'); R(21,0,7,1,vShade('#e8c22a',.5));
  R(26,2,2,2,'#2a2208');                              // visor
  // ---- thrust ----
  const t=fr%2;
  R(6,18,12,1+t,'#ff3fa4'); R(21,18,12,2-t,'#ff3fa4');
  R(4,17,32,1,vShade('#ff3fa4',-.5));
 }
